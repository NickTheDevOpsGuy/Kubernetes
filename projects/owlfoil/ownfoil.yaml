apiVersion: v1
kind: Namespace
metadata:
  name: ownfoil

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ownfoil-games-pv
spec:
  capacity:
    storage: 1Ti

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain
  storageClassName: ownfoil-games-nfs

  mountOptions:
    - nfsvers=4.1
    - hard
    - noatime

  nfs:
    server: 192.168.1.252
    path: /mnt/S/Games/SwitchGames
    readOnly: false

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ownfoil-games-pvc
  namespace: ownfoil
spec:
  accessModes:
    - ReadWriteMany

  storageClassName: ownfoil-games-nfs
  volumeName: ownfoil-games-pv

  resources:
    requests:
      storage: 1Ti

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ownfoil-config
  namespace: ownfoil
spec:
  accessModes:
    - ReadWriteMany

  storageClassName: nfs-client

  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ownfoil-data
  namespace: ownfoil
spec:
  accessModes:
    - ReadWriteMany

  storageClassName: nfs-client

  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ownfoil
  namespace: ownfoil
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ownfoil

  template:
    metadata:
      labels:
        app: ownfoil

    spec:
      containers:
        - name: ownfoil
          image: a1ex4/ownfoil:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8465
              protocol: TCP

          volumeMounts:
            - name: games
              mountPath: /games
              readOnly: false

            - name: config
              mountPath: /app/config

            - name: data
              mountPath: /app/data

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: games
          persistentVolumeClaim:
            claimName: ownfoil-games-pvc

        - name: config
          persistentVolumeClaim:
            claimName: ownfoil-config

        - name: data
          persistentVolumeClaim:
            claimName: ownfoil-data

---
apiVersion: v1
kind: Service
metadata:
  name: ownfoil
  namespace: ownfoil
spec:
  type: ClusterIP

  selector:
    app: ownfoil

  ports:
    - name: http
      port: 8465
      targetPort: 8465
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ownfoil
  namespace: ownfoil

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - ownfoil.home.nickhelps.tech
      secretName: wildcard-home-nickhelps-tech-tls

  rules:
    - host: ownfoil.home.nickhelps.tech
      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: ownfoil

                port:
                  number: 8465
